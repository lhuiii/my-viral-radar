name: Deploy Dashboard

on:
  workflow_run:
    workflows: ["Analyze Posts", "Rewrite To My Voice"]
    types: [completed]
  schedule:
    # 兜底:万一上游链条断了,每周一 16:00 大马时间(UTC 08:00)也重建一次
    - cron: "0 8 * * 1"
  # 页面代码(generate_dashboard.py)一更新就自动重新生成网页,不用再手动点 Run workflow。
  # 机器人自己提交的 docs/ 不在这个路径里,不会循环触发。
  push:
    branches: [main]
    paths: ["generate_dashboard.py"]
  workflow_dispatch:

permissions:
  contents: write

# 同一时间只更新一次网页,避免两次同时 push 互相冲突
concurrency:
  group: deploy-dashboard
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate dashboard
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          BRAND: ${{ vars.BRAND }}
          SYNC_DAY: ${{ vars.SYNC_DAY }}
        run: python generate_dashboard.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update dashboard [skip ci]"
            git pull --rebase
            git push
          fi
